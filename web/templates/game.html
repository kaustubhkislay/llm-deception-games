{% extends "base.html" %}

{% block title %}LLM Mafia - Live Game{% endblock %}

{% block content %}
<header class="game-header">
    <h1>LLM Mafia</h1>
    <div id="phase-indicator" class="phase-badge phase-unknown">
        <span class="phase-name">Loading...</span>
        <span class="day-number"></span>
    </div>
</header>

<!-- Timeline Navigation -->
<div class="timeline-container">
    <div id="timeline" class="timeline">
        <!-- Populated by JS -->
    </div>
</div>

<main class="game-layout">
    <!-- Players Panel -->
    <aside class="players-panel">
        <h2>Players</h2>
        <ul id="players-list" class="players-list">
            <!-- Populated by JS -->
        </ul>
    </aside>

    <!-- Main Chat Area -->
    <section class="chat-panel">
        <h2>Town Square</h2>
        <div id="chat-messages" class="chat-messages">
            <div class="chat-placeholder">Waiting for game to start...</div>
        </div>
    </section>

    <!-- Events / Night Log Panel -->
    <aside class="events-panel">
        <h2>Game Log</h2>
        <div id="game-log" class="game-log">
            <!-- Populated by JS -->
        </div>
        
        <h2>Votes</h2>
        <div id="votes-display" class="votes-display">
            <div class="vote-placeholder">No active vote</div>
        </div>
        
        <!-- Mafia Chat (shown during night) -->
        <div id="mafia-chat-panel" class="mafia-chat-panel" style="display: none;">
            <h3>🔪 Mafia Private Chat</h3>
            <div id="mafia-chat-messages" class="mafia-chat-messages">
                <!-- Populated by JS -->
            </div>
        </div>
    </aside>
</main>

<!-- Game Over Modal -->
<div id="game-over-modal" class="modal hidden" onclick="dismissModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="dismissModal()">&times;</button>
        <h2 id="winner-text">Game Over</h2>
        <div id="final-roles" class="final-roles"></div>
        <div class="modal-buttons">
            <button onclick="dismissModal()">View Game History</button>
            <button onclick="location.reload()">New Game</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Game state
let gameState = {
    phase: 'UNKNOWN',
    dayNumber: 0,
    players: [],
    messages: [],
    votes: {},
    winner: null
};

// Timeline state - stores snapshots at each phase
let timelineState = {
    phases: [],          // Array of phase objects
    currentIndex: -1,    // Currently viewing index (-1 = live)
    isLive: true,        // Whether we're watching live
    mafiaMessages: [],   // Mafia chat messages
    nightActions: []     // Night actions for current phase
};

// Player colors - consistent colors for each player
const PLAYER_COLORS = {
    'Alice': '#e74c3c',    // Red
    'Bob': '#3498db',      // Blue
    'Charlie': '#2ecc71',  // Green
    'Diana': '#9b59b6',    // Purple
    'Edward': '#f39c12',   // Orange
    'Fiona': '#1abc9c',    // Teal
    'George': '#e91e63',   // Pink
};

function getPlayerColor(name) {
    return PLAYER_COLORS[name] || '#95a5a6';  // Default gray
}

// DOM elements
const phaseIndicator = document.getElementById('phase-indicator');
const phaseName = phaseIndicator.querySelector('.phase-name');
const dayNumber = phaseIndicator.querySelector('.day-number');
const playersList = document.getElementById('players-list');
const chatMessages = document.getElementById('chat-messages');
const gameLog = document.getElementById('game-log');
const votesDisplay = document.getElementById('votes-display');
const gameOverModal = document.getElementById('game-over-modal');
const winnerText = document.getElementById('winner-text');
const finalRoles = document.getElementById('final-roles');
const timeline = document.getElementById('timeline');
const mafiaChatPanel = document.getElementById('mafia-chat-panel');
const mafiaChatMessages = document.getElementById('mafia-chat-messages');

// Phase icons for timeline
const PHASE_ICONS = {
    'NIGHT': '🌙',
    'DAY': '☀️',
    'VOTING': '🗳️',
    'GAME_OVER': '🏁'
};

// Render timeline
function renderTimeline() {
    if (timelineState.phases.length === 0) {
        timeline.innerHTML = '<span style="color: var(--text-muted); font-style: italic;">Game starting...</span>';
        return;
    }
    
    let html = '';
    let lastDay = 0;
    
    timelineState.phases.forEach((phase, idx) => {
        // Add day marker when day changes
        if (phase.dayNumber !== lastDay) {
            if (idx > 0) html += '<div class="timeline-connector"></div>';
            html += `<div class="timeline-day-marker">Day ${phase.dayNumber}</div>`;
            lastDay = phase.dayNumber;
        } else if (idx > 0) {
            html += '<div class="timeline-connector"></div>';
        }
        
        const isActive = (timelineState.isLive && idx === timelineState.phases.length - 1) || 
                        (!timelineState.isLive && idx === timelineState.currentIndex);
        
        html += `
            <div class="timeline-phase phase-${phase.phase.toLowerCase()} ${isActive ? 'active' : ''}" 
                 onclick="navigateToPhase(${idx})"
                 title="${phase.phase} - Day ${phase.dayNumber}">
                <span class="timeline-phase-icon">${PHASE_ICONS[phase.phase] || '❓'}</span>
                <span class="timeline-phase-label">${phase.phase}</span>
            </div>
        `;
    });
    
    // Add "Live" indicator if we're caught up
    if (timelineState.isLive) {
        html += '<div class="timeline-connector"></div>';
        html += `
            <div class="timeline-phase active" style="background: var(--accent-green); border-radius: 4px;">
                <span class="timeline-phase-icon">📺</span>
                <span class="timeline-phase-label" style="color: white;">LIVE</span>
            </div>
        `;
    }
    
    timeline.innerHTML = html;
}

// Navigate to a specific phase in the timeline
function navigateToPhase(index) {
    if (index < 0 || index >= timelineState.phases.length) return;
    
    timelineState.currentIndex = index;
    timelineState.isLive = (index === timelineState.phases.length - 1);
    
    const snapshot = timelineState.phases[index];
    
    // Update UI to show this snapshot
    updatePhase(snapshot.phase, snapshot.dayNumber);
    updatePlayers(snapshot.players);
    
    // Show messages up to this point
    chatMessages.innerHTML = '';
    snapshot.messagesSnapshot.forEach(addChatMessage);
    
    // Show votes at this point
    updateVotes(snapshot.votesSnapshot || {});
    
    // Show/hide mafia chat based on phase
    if (snapshot.phase === 'NIGHT') {
        showMafiaChat(snapshot.mafiaMessagesSnapshot || [], snapshot.nightActionsSnapshot || []);
    } else {
        hideMafiaChat();
    }
    
    renderTimeline();
}

// Go live (latest state)
function goLive() {
    timelineState.isLive = true;
    timelineState.currentIndex = timelineState.phases.length - 1;
    navigateToPhase(timelineState.currentIndex);
}

// Add a phase to the timeline
function addPhaseToTimeline(phase, dayNum) {
    // Snapshot current state
    const snapshot = {
        phase: phase,
        dayNumber: dayNum,
        players: JSON.parse(JSON.stringify(gameState.players)),
        messagesSnapshot: [...gameState.messages],
        votesSnapshot: {...gameState.votes},
        mafiaMessagesSnapshot: [...timelineState.mafiaMessages],
        nightActionsSnapshot: [...timelineState.nightActions]
    };
    
    timelineState.phases.push(snapshot);
    
    // Clear mafia messages and night actions for new phase
    if (phase !== 'NIGHT') {
        timelineState.mafiaMessages = [];
        timelineState.nightActions = [];
    }
    
    if (timelineState.isLive) {
        timelineState.currentIndex = timelineState.phases.length - 1;
    }
    
    renderTimeline();
}

// Show mafia chat panel
function showMafiaChat(messages, nightActions) {
    mafiaChatPanel.style.display = 'block';
    
    let html = '';
    
    // Show mafia chat messages
    if (messages.length > 0) {
        html += '<div style="margin-bottom: 0.75rem; color: var(--text-muted); font-size: 0.8rem;">Private discussion:</div>';
        messages.forEach(msg => {
            html += `
                <div class="mafia-message">
                    <span class="msg-sender">${msg.sender}:</span>
                    <span class="msg-content">${escapeHtml(msg.content)}</span>
                </div>
            `;
        });
    }
    
    // Show night actions
    if (nightActions.length > 0) {
        html += '<div style="margin-top: 0.75rem; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.8rem;">Night actions:</div>';
        nightActions.forEach(action => {
            const actionIcon = action.role === 'MAFIA' ? '🔪' : 
                              action.role === 'DOCTOR' ? '💉' : 
                              action.role === 'DETECTIVE' ? '🔍' : '❓';
            html += `
                <div class="mafia-message" style="border-color: ${action.role === 'MAFIA' ? 'var(--accent-red)' : 'var(--accent-blue)'};">
                    <span>${actionIcon}</span>
                    <span class="msg-sender">${action.player}</span>
                    <span>→ ${action.target}</span>
                </div>
            `;
        });
    }
    
    if (!html) {
        html = '<div style="color: var(--text-muted); font-style: italic;">Waiting for night actions...</div>';
    }
    
    mafiaChatMessages.innerHTML = html;
}

// Hide mafia chat panel
function hideMafiaChat() {
    mafiaChatPanel.style.display = 'none';
}

// Update phase indicator
function updatePhase(phase, day) {
    phaseIndicator.className = `phase-badge phase-${phase.toLowerCase()}`;
    phaseName.textContent = phase;
    if (day) {
        dayNumber.textContent = `Day ${day}`;
    }
}

// Update players list
function updatePlayers(players) {
    playersList.innerHTML = players.map(p => `
        <li class="player-item ${p.is_alive ? 'alive' : 'dead'}">
            <a href="/player/${p.name}" target="_blank" class="player-link" style="border-left: 4px solid ${getPlayerColor(p.name)}">
                <span class="player-name" style="color: ${getPlayerColor(p.name)}">${p.name}</span>
                <span class="player-status">${p.is_alive ? '🟢' : '💀'}</span>
                ${p.role ? `<span class="player-role">${p.role}</span>` : ''}
            </a>
        </li>
    `).join('');
}

// Add a chat message
function addChatMessage(msg) {
    // Remove placeholder if present
    const placeholder = chatMessages.querySelector('.chat-placeholder');
    if (placeholder) placeholder.remove();
    
    const time = new Date(msg.timestamp).toLocaleTimeString();
    const senderColor = getPlayerColor(msg.sender);
    const msgEl = document.createElement('div');
    msgEl.className = 'chat-message';
    msgEl.style.borderLeftColor = senderColor;
    msgEl.innerHTML = `
        <span class="msg-time">${time}</span>
        <span class="msg-sender" style="color: ${senderColor}">${msg.sender}:</span>
        <span class="msg-content">${escapeHtml(msg.content)}</span>
    `;
    chatMessages.appendChild(msgEl);
    // Don't auto-scroll - let user control the view
}

// Add a game log entry
function addLogEntry(text, type = 'info') {
    const entry = document.createElement('div');
    entry.className = `log-entry log-${type}`;
    entry.innerHTML = `
        <span class="log-time">${new Date().toLocaleTimeString()}</span>
        <span class="log-text">${text}</span>
    `;
    gameLog.appendChild(entry);
    // Don't auto-scroll - let user control the view
}

// Update votes display
function updateVotes(votes) {
    if (Object.keys(votes).length === 0) {
        votesDisplay.innerHTML = '<div class="vote-placeholder">No votes yet</div>';
        return;
    }
    
    // Count votes
    const voteCounts = {};
    for (const [voter, target] of Object.entries(votes)) {
        voteCounts[target] = (voteCounts[target] || 0) + 1;
    }
    
    // Sort by vote count
    const sorted = Object.entries(voteCounts).sort((a, b) => b[1] - a[1]);
    
    votesDisplay.innerHTML = sorted.map(([name, count]) => `
        <div class="vote-bar">
            <span class="vote-name" style="color: ${getPlayerColor(name)}">${name}</span>
            <div class="vote-count-bar" style="width: ${count * 20}%; background: ${getPlayerColor(name)}"></div>
            <span class="vote-count">${count}</span>
        </div>
    `).join('');
}

// Show game over
function showGameOver(winner, players) {
    winnerText.textContent = `${winner} Wins!`;
    finalRoles.innerHTML = players.map(p => `
        <div class="final-player ${p.is_alive ? 'alive' : 'dead'}">
            <span class="player-name">${p.name}</span>
            <span class="player-role role-${p.role.toLowerCase()}">${p.role}</span>
            <span class="player-status">${p.is_alive ? 'Survived' : 'Dead'}</span>
        </div>
    `).join('');
    gameOverModal.classList.remove('hidden');
}

// Dismiss the game over modal
function dismissModal(event) {
    // If called with event (backdrop click), only close if clicking the backdrop itself
    if (event && event.target !== gameOverModal) return;
    gameOverModal.classList.add('hidden');
}

// Escape HTML
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Handle SSE events
function handleEvent(event) {
    const data = JSON.parse(event.data);
    console.log('Event:', data);
    
    switch (data.event_type) {
        case 'INITIAL_STATE':
            // Load initial state (replay mode)
            gameState.players = data.data.players;
            gameState.messages = data.data.messages || [];
            gameState.votes = data.data.current_votes || {};
            gameState.phase = data.data.phase;
            gameState.dayNumber = data.data.day_number;
            
            // Load timeline from phase_history if available
            if (data.data.phase_history) {
                timelineState.phases = data.data.phase_history;
                timelineState.currentIndex = timelineState.phases.length - 1;
                timelineState.isLive = false;
                renderTimeline();
                // Navigate to the last phase
                if (timelineState.phases.length > 0) {
                    navigateToPhase(timelineState.phases.length - 1);
                }
            } else {
                updatePhase(data.data.phase, data.data.day_number);
                updatePlayers(data.data.players);
                data.data.messages.forEach(addChatMessage);
                updateVotes(data.data.current_votes || {});
            }
            
            if (data.data.winner) {
                showGameOver(data.data.winner, data.data.players);
            }
            break;
            
        case 'GAME_START':
            addLogEntry('Game started!', 'start');
            gameState.players = data.data.players;
            updatePlayers(data.data.players);
            break;
            
        case 'PHASE_CHANGE':
            // Add current phase to timeline before switching
            addPhaseToTimeline(data.data.phase, data.data.day_number);
            
            gameState.phase = data.data.phase;
            gameState.dayNumber = data.data.day_number;
            
            if (timelineState.isLive) {
                updatePhase(data.data.phase, data.data.day_number);
                addLogEntry(`Phase: ${data.data.phase} (Day ${data.data.day_number})`, 'phase');
                
                if (data.data.phase === 'VOTING') {
                    gameState.votes = {};
                    updateVotes({});
                    hideMafiaChat();
                } else if (data.data.phase === 'NIGHT') {
                    showMafiaChat([], []);
                } else if (data.data.phase === 'DAY') {
                    hideMafiaChat();
                }
            }
            break;
            
        case 'PUBLIC_MESSAGE':
            gameState.messages.push(data.data);
            if (timelineState.isLive) {
                addChatMessage(data.data);
            }
            break;
            
        case 'NIGHT_ACTION':
            timelineState.nightActions.push(data.data);
            addLogEntry(`[SECRET] ${data.data.role}: ${data.data.player} targets ${data.data.target}`, 'night');
            if (timelineState.isLive && gameState.phase === 'NIGHT') {
                showMafiaChat(timelineState.mafiaMessages, timelineState.nightActions);
            }
            break;
            
        case 'MAFIA_CHAT':
            // Handle mafia private chat messages
            timelineState.mafiaMessages.push(data.data);
            if (timelineState.isLive && gameState.phase === 'NIGHT') {
                showMafiaChat(timelineState.mafiaMessages, timelineState.nightActions);
            }
            break;
            
        case 'NIGHT_RESULT':
            if (data.data.killed) {
                addLogEntry(`${data.data.killed} was killed by the mafia!`, 'death');
            } else if (data.data.saved) {
                addLogEntry(`Someone was saved by the doctor!`, 'save');
            } else {
                addLogEntry('No one died during the night.', 'info');
            }
            break;
            
        case 'VOTE_CAST':
            gameState.votes[data.data.voter] = data.data.target;
            if (timelineState.isLive) {
                updateVotes(gameState.votes);
            }
            addLogEntry(`${data.data.voter} voted for ${data.data.target}`, 'vote');
            break;
            
        case 'VOTE_RESULT':
            if (data.data.lynched) {
                addLogEntry(`${data.data.lynched} was lynched! They were ${data.data.lynched_role || 'unknown'}.`, 'death');
            } else if (data.data.was_tie) {
                addLogEntry('Vote was tied. No one was lynched.', 'info');
            }
            gameState.votes = {};
            break;
            
        case 'PLAYER_DEATH':
            addLogEntry(`${data.data.player} died (${data.data.cause})`, 'death');
            // Update player in gameState
            const deadPlayer = gameState.players.find(p => p.name === data.data.player);
            if (deadPlayer) deadPlayer.is_alive = false;
            if (timelineState.isLive) {
                updatePlayers(gameState.players);
            }
            break;
            
        case 'GAME_END':
            addPhaseToTimeline('GAME_OVER', gameState.dayNumber);
            gameState.players = data.data.players;
            showGameOver(data.data.winner, data.data.players);
            break;
    }
}

// Connect to SSE
const evtSource = new EventSource('/events');
evtSource.onmessage = handleEvent;
evtSource.onerror = function(e) {
    console.error('SSE error:', e);
    addLogEntry('Connection lost. Reconnecting...', 'error');
};

// Initial load
fetch('/api/state')
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            addLogEntry('Waiting for game to start...', 'info');
        } else {
            updatePhase(data.phase, data.day_number);
            updatePlayers(data.players);
            data.messages.forEach(addChatMessage);
        }
    })
    .catch(e => console.error('Initial load error:', e));
</script>
{% endblock %}

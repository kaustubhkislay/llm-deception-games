{% extends "base.html" %}

{% block title %}LLM Mafia - Live Game{% endblock %}

{% block content %}
<header class="game-header">
    <h1>LLM Mafia</h1>
    <div id="phase-indicator" class="phase-badge phase-unknown">
        <span class="phase-name">Loading...</span>
        <span class="day-number"></span>
    </div>
</header>

<!-- Timeline Navigation -->
<div class="timeline-container">
    <div id="timeline" class="timeline">
        <span class="timeline-loading">Loading timeline...</span>
    </div>
</div>

<main class="game-layout">
    <!-- Players Panel -->
    <aside class="players-panel">
        <h2>Players</h2>
        <ul id="players-list" class="players-list">
            <!-- Populated by JS -->
        </ul>
        <div class="back-button-container" id="back-button-container" style="display: none;">
            <button id="back-to-square-btn" class="back-to-square-btn" onclick="backToTownSquare()">
                ← Back to Town Square
            </button>
        </div>
    </aside>

    <!-- Main Panel - Content changes by phase -->
    <section class="main-panel" id="main-panel">
        <div class="panel-header">
            <h2 id="panel-title">Town Square</h2>
        </div>
        <div id="panel-content" class="panel-content">
            <div class="panel-placeholder">Waiting for game to start...</div>
        </div>
    </section>
</main>

<!-- Game Over Modal -->
<div id="game-over-modal" class="modal hidden" onclick="dismissModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="dismissModal()">&times;</button>
        <h2 id="winner-text">Game Over</h2>
        <div id="final-roles" class="final-roles"></div>
        <div class="modal-buttons">
            <button onclick="dismissModal()">View Game History</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Game state
let gameState = {
    phase: 'UNKNOWN',
    dayNumber: 0,
    players: [],
    winner: null
};

// Timeline and phase tracking
let timelineState = {
    phases: [],           // Array of phase snapshots
    currentIndex: -1,     // Currently viewing index
    liveIndex: -1,        // Latest live phase index
    isLive: true,         // Whether we're watching live
    viewingPlayer: null   // Player name if viewing thoughts, null for town square
};

// Player colors
const PLAYER_COLORS = {
    'Alice': '#e74c3c',
    'Bob': '#3498db',
    'Charlie': '#2ecc71',
    'Diana': '#9b59b6',
    'Edward': '#f39c12',
    'Fiona': '#1abc9c',
    'George': '#e91e63',
};

const PHASE_ICONS = {
    'NIGHT': '🌙',
    'DAY': '☀️',
    'VOTING': '🗳️',
    'GAME_OVER': '🏁'
};

const ROLE_ICONS = {
    'DETECTIVE': '🔍',
    'DOCTOR': '💉',
    'MAFIA': '🔪',
    'TOWN': '🏠'
};

function getPlayerColor(name) {
    return PLAYER_COLORS[name] || '#95a5a6';
}

// DOM elements
const phaseIndicator = document.getElementById('phase-indicator');
const phaseName = phaseIndicator.querySelector('.phase-name');
const dayNumberEl = phaseIndicator.querySelector('.day-number');
const playersList = document.getElementById('players-list');
const timeline = document.getElementById('timeline');
const mainPanel = document.getElementById('main-panel');
const panelTitle = document.getElementById('panel-title');
const panelContent = document.getElementById('panel-content');
const gameOverModal = document.getElementById('game-over-modal');
const winnerText = document.getElementById('winner-text');
const finalRoles = document.getElementById('final-roles');
const backButtonContainer = document.getElementById('back-button-container');

// Escape HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Update phase indicator
function updatePhaseIndicator(phase, day) {
    phaseIndicator.className = `phase-badge phase-${phase.toLowerCase()}`;
    phaseName.textContent = phase;
    if (day) {
        dayNumberEl.textContent = `Day ${day}`;
    }
}

// Update players list
function updatePlayers(players) {
    playersList.innerHTML = players.map(p => `
        <li class="player-item ${p.is_alive ? 'alive' : 'dead'}">
            <a href="javascript:void(0)" onclick="viewPlayerThoughts('${p.name}')" 
               class="player-link" style="border-left: 4px solid ${getPlayerColor(p.name)}">
                <span class="player-name" style="color: ${getPlayerColor(p.name)}">${p.name}</span>
                <span class="player-role role-${p.role.toLowerCase()}">${p.role}</span>
                <span class="player-status">${p.is_alive ? '🟢' : '💀'}</span>
            </a>
        </li>
    `).join('');
}

// Render timeline
function renderTimeline() {
    if (timelineState.phases.length === 0) {
        timeline.innerHTML = '<span class="timeline-loading">Waiting for game...</span>';
        return;
    }
    
    let html = '';
    let lastDay = 0;
    
    timelineState.phases.forEach((phase, idx) => {
        // Add day marker when day changes
        if (phase.dayNumber !== lastDay) {
            if (idx > 0) html += '<div class="timeline-connector"></div>';
            html += `<div class="timeline-day-marker">Day ${phase.dayNumber}</div>`;
            lastDay = phase.dayNumber;
        } else if (idx > 0) {
            html += '<div class="timeline-connector"></div>';
        }
        
        const isActive = idx === timelineState.currentIndex;
        const isLive = idx === timelineState.liveIndex && timelineState.isLive;
        
        html += `
            <div class="timeline-phase phase-${phase.phase.toLowerCase()} ${isActive ? 'active' : ''}" 
                 onclick="navigateToPhase(${idx})"
                 title="${phase.phase} - Day ${phase.dayNumber}">
                <span class="timeline-phase-icon">${PHASE_ICONS[phase.phase] || '❓'}</span>
                <span class="timeline-phase-label">${phase.phase}</span>
            </div>
        `;
    });
    
    // Add "Live" indicator
    if (timelineState.isLive && timelineState.currentIndex === timelineState.liveIndex) {
        html += '<div class="timeline-connector"></div>';
        html += `
            <div class="timeline-live-indicator">
                <span class="live-dot"></span>
                <span>LIVE</span>
            </div>
        `;
    }
    
    timeline.innerHTML = html;
}

// Navigate to a specific phase
function navigateToPhase(index) {
    if (index < 0 || index >= timelineState.phases.length) return;
    
    timelineState.currentIndex = index;
    timelineState.isLive = (index === timelineState.liveIndex);
    
    const snapshot = timelineState.phases[index];
    
    // Update phase indicator
    updatePhaseIndicator(snapshot.phase, snapshot.dayNumber);
    
    // Update players
    updatePlayers(snapshot.players);
    
    // Render main panel based on phase type and whether viewing player
    if (timelineState.viewingPlayer) {
        renderPlayerThoughts(timelineState.viewingPlayer, snapshot);
    } else {
        renderPhaseContent(snapshot);
    }
    
    renderTimeline();
}

// Render main panel content based on phase
function renderPhaseContent(snapshot) {
    panelTitle.textContent = `${snapshot.phase} - Day ${snapshot.dayNumber}`;
    backButtonContainer.style.display = 'none';
    
    let html = '';
    
    if (snapshot.phase === 'NIGHT') {
        html = renderNightPhase(snapshot);
    } else if (snapshot.phase === 'DAY') {
        html = renderDayPhase(snapshot);
    } else if (snapshot.phase === 'VOTING') {
        html = renderVotingPhase(snapshot);
    } else if (snapshot.phase === 'GAME_OVER') {
        html = renderGameOver(snapshot);
    } else {
        html = '<div class="panel-placeholder">Unknown phase</div>';
    }
    
    panelContent.innerHTML = html;
}

// Render night phase - render events in chronological order as they occurred
function renderNightPhase(snapshot) {
    let html = '';
    const events = snapshot.events || [];
    
    if (events.length === 0) {
        html = '<div class="panel-placeholder">Night phase in progress...</div>';
        return html;
    }
    
    // Track if we're in a mafia section
    let inMafiaSection = false;
    
    for (const event of events) {
        if (event.type === 'gm_message') {
            // Close mafia section if open
            if (inMafiaSection) {
                html += '</div></div>';
                inMafiaSection = false;
            }
            html += renderGmMessage(event.content || event.data?.content);
            
        } else if (event.type === 'night_reasoning') {
            // Close mafia section if open
            if (inMafiaSection) {
                html += '</div></div>';
                inMafiaSection = false;
            }
            html += renderNightActionBlock(event.role, event);
            
        } else if (event.type === 'mafia_chat') {
            // Open mafia section if not open
            if (!inMafiaSection) {
                html += '<div class="night-section mafia-section">';
                html += '<div class="section-header"><span class="role-icon">🔪</span> MAFIA DISCUSSION</div>';
                html += '<div class="section-content">';
                inMafiaSection = true;
            }
            html += `
                <div class="mafia-message">
                    <span class="msg-sender" style="color: ${getPlayerColor(event.sender)}">[${event.sender}]</span>
                    <span class="msg-content">${escapeHtml(event.content)}</span>
                </div>
            `;
            
        } else if (event.type === 'kill_intention') {
            // Open mafia section if not open
            if (!inMafiaSection) {
                html += '<div class="night-section mafia-section">';
                html += '<div class="section-header"><span class="role-icon">🔪</span> MAFIA DISCUSSION</div>';
                html += '<div class="section-content">';
                inMafiaSection = true;
            }
            html += `
                <div class="kill-intention">
                    <span class="player-name" style="color: ${getPlayerColor(event.player)}">${event.player}</span>
                    <span class="intention-arrow">→ Kill:</span>
                    <span class="target-name" style="color: ${getPlayerColor(event.target)}">${event.target}</span>
                </div>
            `;
        }
    }
    
    // Close mafia section if still open
    if (inMafiaSection) {
        html += '</div></div>';
    }
    
    return html;
}

// Render night action block (Detective/Doctor)
function renderNightActionBlock(role, data) {
    const icon = ROLE_ICONS[role] || '❓';
    const roleClass = role.toLowerCase();
    
    let html = `
        <div class="night-section ${roleClass}-section">
            <div class="section-header">
                <span class="role-icon">${icon}</span> 
                ${role} - ${data.player}
            </div>
            <div class="section-content">
    `;
    
    if (data.reasoning) {
        html += `
            <div class="reasoning-block">
                <div class="reasoning-label">Reasoning:</div>
                <div class="reasoning-text">"${escapeHtml(data.reasoning)}"</div>
            </div>
        `;
    }
    
    html += `
        <div class="action-block">
            <span class="action-label">[night_action]</span>
            <span class="action-target">target: "${data.target}"</span>
        </div>
    `;
    
    if (data.result) {
        html += `
            <div class="result-block">
                <span class="result-label">Result:</span>
                <span class="result-text">${escapeHtml(data.result)}</span>
            </div>
        `;
    }
    
    html += '</div></div>';
    return html;
}

// Render GM message
function renderGmMessage(content) {
    return `
        <div class="gm-message">
            <span class="gm-icon">📜</span>
            <span class="gm-text">${escapeHtml(content)}</span>
        </div>
    `;
}

// Render day phase
function renderDayPhase(snapshot) {
    let html = '';
    const messages = snapshot.messages || [];
    
    if (messages.length === 0) {
        html = '<div class="panel-placeholder">No discussion yet...</div>';
    } else {
        for (const msg of messages) {
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString() : '';
            html += `
                <div class="chat-message" style="border-left-color: ${getPlayerColor(msg.sender)}">
                    <span class="msg-time">${time}</span>
                    <span class="msg-sender" style="color: ${getPlayerColor(msg.sender)}">${msg.sender}:</span>
                    <span class="msg-content">${escapeHtml(msg.content)}</span>
                </div>
            `;
        }
    }
    
    return html;
}

// Render voting phase
function renderVotingPhase(snapshot) {
    let html = '';
    const events = snapshot.events || [];
    const votes = events.filter(e => e.type === 'vote');
    const voteResult = events.find(e => e.type === 'vote_result');
    
    html += renderGmMessage("The town gathers to vote. Each player will cast their vote.");
    
    html += '<div class="votes-container">';
    
    for (const vote of votes) {
        html += `
            <div class="vote-block">
                <div class="vote-header">
                    <span class="voter-name" style="color: ${getPlayerColor(vote.voter)}">${vote.voter}</span>
                </div>
                <div class="vote-reasoning">"${escapeHtml(vote.reasoning || 'No reasoning provided')}"</div>
                <div class="vote-target">
                    <span class="votes-label">VOTES:</span>
                    <span class="target-name" style="color: ${getPlayerColor(vote.target)}">${vote.target}</span>
                </div>
            </div>
        `;
    }
    
    html += '</div>';
    
    // Vote tally
    if (votes.length > 0) {
        const tally = {};
        for (const vote of votes) {
            tally[vote.target] = (tally[vote.target] || 0) + 1;
        }
        
        html += '<div class="vote-tally">';
        html += '<div class="tally-header">VOTE TALLY</div>';
        const sorted = Object.entries(tally).sort((a, b) => b[1] - a[1]);
        for (const [target, count] of sorted) {
            const voters = votes.filter(v => v.target === target).map(v => v.voter).join(', ');
            html += `
                <div class="tally-row">
                    <span class="tally-name" style="color: ${getPlayerColor(target)}">${target}:</span>
                    <span class="tally-count">${count} vote${count !== 1 ? 's' : ''}</span>
                    <span class="tally-voters">(${voters})</span>
                </div>
            `;
        }
        html += '</div>';
    }
    
    // Result
    if (voteResult) {
        if (voteResult.lynched) {
            const deathEvent = events.find(e => e.type === 'death' && e.cause === 'lynched');
            const alignment = deathEvent?.was_mafia ? "MAFIA" : "not Mafia";
            html += renderGmMessage(`The votes are tallied. ${voteResult.lynched} was lynched. They were ${alignment}.`);
        } else if (voteResult.was_tie) {
            html += renderGmMessage("The votes are tallied. The vote was tied. Nobody was lynched.");
        } else {
            html += renderGmMessage("The votes are tallied. No valid votes were cast. Nobody was lynched.");
        }
    }
    
    return html;
}

// Render game over
function renderGameOver(snapshot) {
    let html = '<div class="game-over-content">';
    
    const winner = gameState.winner || 'UNKNOWN';
    html += `<div class="winner-banner">${winner} WINS!</div>`;
    
    html += '<div class="final-roles-list">';
    for (const p of snapshot.players) {
        html += `
            <div class="final-player ${p.is_alive ? 'alive' : 'dead'}">
                <span class="player-name" style="color: ${getPlayerColor(p.name)}">${p.name}</span>
                <span class="player-role role-${p.role.toLowerCase()}">${p.role}</span>
                <span class="player-status">${p.is_alive ? 'Survived' : 'Dead'}</span>
            </div>
        `;
    }
    html += '</div>';
    
    html += '</div>';
    return html;
}

// View player thoughts
function viewPlayerThoughts(playerName) {
    timelineState.viewingPlayer = playerName;
    backButtonContainer.style.display = 'block';
    
    const snapshot = timelineState.phases[timelineState.currentIndex];
    if (snapshot) {
        renderPlayerThoughts(playerName, snapshot);
    }
}

// Back to town square
function backToTownSquare() {
    timelineState.viewingPlayer = null;
    backButtonContainer.style.display = 'none';
    
    const snapshot = timelineState.phases[timelineState.currentIndex];
    if (snapshot) {
        renderPhaseContent(snapshot);
    }
}

// Render player thoughts (placeholder - needs API call)
function renderPlayerThoughts(playerName, snapshot) {
    panelTitle.textContent = `${playerName}'s Thoughts - ${snapshot.phase} Day ${snapshot.dayNumber}`;
    
    panelContent.innerHTML = `
        <div class="player-thoughts-container">
            <div class="thoughts-header">
                <span style="color: ${getPlayerColor(playerName)}">${playerName}</span>'s internal state during ${snapshot.phase}
            </div>
            <div class="thoughts-content">
                <p class="thoughts-placeholder">
                    Player thought history is available during live games.
                    Click on different phases in the timeline to see thoughts from that phase.
                </p>
            </div>
        </div>
    `;
}

// Show game over modal
function showGameOver(winner, players) {
    winnerText.textContent = `${winner} Wins!`;
    finalRoles.innerHTML = players.map(p => `
        <div class="final-player ${p.is_alive ? 'alive' : 'dead'}">
            <span class="player-name">${p.name}</span>
            <span class="player-role role-${p.role.toLowerCase()}">${p.role}</span>
            <span class="player-status">${p.is_alive ? 'Survived' : 'Dead'}</span>
        </div>
    `).join('');
    gameOverModal.classList.remove('hidden');
}

// Dismiss modal
function dismissModal(event) {
    if (event && event.target !== gameOverModal) return;
    gameOverModal.classList.add('hidden');
}

// Add a new phase to timeline (for live updates)
function addPhaseToTimeline(phaseData) {
    timelineState.phases.push(phaseData);
    timelineState.liveIndex = timelineState.phases.length - 1;
    
    // Auto-advance if watching live
    if (timelineState.isLive || timelineState.currentIndex === -1) {
        timelineState.currentIndex = timelineState.liveIndex;
        timelineState.isLive = true;
        navigateToPhase(timelineState.currentIndex);
    }
    
    renderTimeline();
}

// Update current phase with new event (for live updates)
function updateCurrentPhase(event) {
    if (timelineState.phases.length === 0) {
        // No phases yet - create one
        const newPhase = {
            phase: gameState.phase || 'NIGHT',
            dayNumber: gameState.dayNumber || 1,
            players: JSON.parse(JSON.stringify(gameState.players)),
            events: [],
            messages: [],
            votes: {},
            gmMessages: []
        };
        timelineState.phases.push(newPhase);
        timelineState.liveIndex = 0;
        timelineState.currentIndex = 0;
        timelineState.isLive = true;
        renderTimeline();
    }
    
    const currentPhase = timelineState.phases[timelineState.liveIndex];
    if (!currentPhase.events) currentPhase.events = [];
    currentPhase.events.push(event);
    
    console.log('Added event to phase:', event.type, 'Total events:', currentPhase.events.length);
    
    // Re-render if viewing the current live phase (regardless of isLive flag)
    if (timelineState.currentIndex === timelineState.liveIndex && !timelineState.viewingPlayer) {
        renderPhaseContent(currentPhase);
    }
}

// Handle SSE events
function handleEvent(event) {
    const data = JSON.parse(event.data);
    console.log('Event:', data);
    
    switch (data.event_type) {
        case 'INITIAL_STATE':
            // Load initial state
            gameState.players = data.data.players;
            gameState.phase = data.data.phase;
            gameState.dayNumber = data.data.day_number || 1;
            gameState.winner = data.data.winner;
            
            // Load timeline from phase_history if available
            if (data.data.phase_history && data.data.phase_history.length > 0) {
                timelineState.phases = data.data.phase_history;
                timelineState.liveIndex = timelineState.phases.length - 1;
                timelineState.currentIndex = timelineState.liveIndex;
                // Live if no winner yet (game still in progress)
                timelineState.isLive = !data.data.winner;
                
                renderTimeline();
                navigateToPhase(timelineState.currentIndex);
            } else {
                // No phase history - create initial phase for live game
                const initialPhase = {
                    phase: gameState.phase || 'NIGHT',
                    dayNumber: gameState.dayNumber,
                    players: data.data.players || [],
                    events: [],
                    messages: [],
                    votes: {},
                    gmMessages: []
                };
                timelineState.phases.push(initialPhase);
                timelineState.liveIndex = 0;
                timelineState.currentIndex = 0;
                timelineState.isLive = true;
                
                updatePlayers(data.data.players || []);
                updatePhaseIndicator(gameState.phase, gameState.dayNumber);
                renderTimeline();
                renderPhaseContent(initialPhase);
            }
            
            if (data.data.winner) {
                showGameOver(data.data.winner, data.data.players);
            }
            break;
            
        case 'GAME_START':
            gameState.players = data.data.players;
            gameState.dayNumber = 1;
            updatePlayers(data.data.players);
            
            // If no phases yet, we'll create one when we get PHASE_CHANGE
            // Mark as live since game just started
            timelineState.isLive = true;
            break;
            
        case 'PHASE_CHANGE':
            gameState.phase = data.data.phase;
            gameState.dayNumber = data.data.day_number;
            
            // Create new phase snapshot
            const newPhase = {
                phase: data.data.phase,
                dayNumber: data.data.day_number,
                players: JSON.parse(JSON.stringify(gameState.players)),
                events: [],
                messages: [],
                votes: {},
                gmMessages: []
            };
            
            addPhaseToTimeline(newPhase);
            break;
            
        case 'GM_MESSAGE':
            updateCurrentPhase({type: 'gm_message', ...data.data});
            break;
            
        case 'NIGHT_REASONING':
            updateCurrentPhase({type: 'night_reasoning', ...data.data});
            break;
            
        case 'MAFIA_CHAT':
            updateCurrentPhase({type: 'mafia_chat', ...data.data});
            break;
            
        case 'MAFIA_KILL_INTENTION':
            updateCurrentPhase({type: 'kill_intention', ...data.data});
            break;
            
        case 'PUBLIC_MESSAGE':
            // Add to current phase messages
            if (timelineState.phases.length > 0) {
                const phase = timelineState.phases[timelineState.liveIndex];
                if (!phase.messages) phase.messages = [];
                phase.messages.push({type: 'message', ...data.data});
                updateCurrentPhase({type: 'message', ...data.data});
            }
            break;
            
        case 'VOTE_REASONING':
            updateCurrentPhase({type: 'vote', ...data.data});
            break;
            
        case 'VOTE_RESULT':
            updateCurrentPhase({type: 'vote_result', ...data.data});
            break;
            
        case 'NIGHT_RESULT':
            updateCurrentPhase({type: 'night_result', ...data.data});
            break;
            
        case 'PLAYER_DEATH':
            // Update player status
            const deadPlayer = gameState.players.find(p => p.name === data.data.player);
            if (deadPlayer) deadPlayer.is_alive = false;
            
            // Update in current phase
            if (timelineState.phases.length > 0) {
                const phase = timelineState.phases[timelineState.liveIndex];
                phase.players = JSON.parse(JSON.stringify(gameState.players));
            }
            
            updateCurrentPhase({type: 'death', ...data.data});
            updatePlayers(gameState.players);
            break;
            
        case 'GAME_END':
            gameState.winner = data.data.winner;
            gameState.players = data.data.players;
            
            // Add final phase
            const gameOverPhase = {
                phase: 'GAME_OVER',
                dayNumber: gameState.dayNumber,
                players: data.data.players,
                events: [],
                messages: [],
                votes: {},
                gmMessages: []
            };
            addPhaseToTimeline(gameOverPhase);
            
            showGameOver(data.data.winner, data.data.players);
            break;
    }
}

// Connect to SSE
const evtSource = new EventSource('/events');
evtSource.onmessage = handleEvent;
evtSource.onerror = function(e) {
    console.error('SSE error:', e);
};

// Initial load
fetch('/api/state')
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            panelContent.innerHTML = '<div class="panel-placeholder">Waiting for game to start...</div>';
        } else {
            gameState.players = data.players;
            gameState.phase = data.phase;
            gameState.dayNumber = data.day_number;
            updatePlayers(data.players);
        }
    })
    .catch(e => console.error('Initial load error:', e));
</script>
{% endblock %}

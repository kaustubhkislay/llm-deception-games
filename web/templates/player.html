{% extends "base.html" %}

{% block title %}{{ player_name }} - LLM Mafia{% endblock %}

{% block content %}
<header class="game-header">
    <h1>LLM Mafia</h1>
    <div id="phase-indicator" class="phase-badge phase-unknown">
        <span class="phase-name">Loading...</span>
        <span class="day-number"></span>
    </div>
</header>

<!-- Timeline Navigation -->
<div class="timeline-container">
    <div id="timeline" class="timeline">
        <span class="timeline-loading">Loading timeline...</span>
    </div>
</div>

<main class="game-layout">
    <!-- Players Panel -->
    <aside class="players-panel">
        <h2>Players</h2>
        <ul id="players-list" class="players-list">
            <!-- Populated by JS -->
        </ul>
        <div class="back-button-container">
            <button id="back-to-square-btn" class="back-to-square-btn" onclick="backToTownSquare()">
                ← Back to Town Square
            </button>
        </div>
    </aside>

    <!-- Main Panel - Player Thoughts -->
    <section class="main-panel" id="main-panel">
        <div class="panel-header">
            <h2 id="panel-title">{{ player_name }}'s Thoughts</h2>
        </div>
        <div id="panel-content" class="panel-content">
            <div id="thoughts-container" class="thoughts-container">
                <div class="thoughts-placeholder">Loading thoughts...</div>
            </div>
        </div>
    </section>
</main>
{% endblock %}

{% block scripts %}
<script>
const playerName = "{{ player_name }}";

// Player colors
const PLAYER_COLORS = {
    'Alice': '#e74c3c',
    'Bob': '#3498db',
    'Charlie': '#2ecc71',
    'Diana': '#9b59b6',
    'Edward': '#f39c12',
    'Fiona': '#1abc9c',
    'George': '#e91e63',
};

const PHASE_ICONS = {
    'NIGHT': '🌙',
    'DAY': '☀️',
    'VOTING': '🗳️',
    'GAME_OVER': '🏁'
};

function getPlayerColor(name) {
    return PLAYER_COLORS[name] || '#95a5a6';
}

// Game state
let gameState = {
    phase: 'UNKNOWN',
    dayNumber: 0,
    players: []
};

// Timeline state
let timelineState = {
    phases: [],
    currentIndex: -1,
    liveIndex: -1,
    isLive: true
};

// Thoughts grouped by phase
let thoughtsByPhase = {};
let currentPhaseKey = null;

// DOM elements
const phaseIndicator = document.getElementById('phase-indicator');
const phaseName = phaseIndicator.querySelector('.phase-name');
const dayNumberEl = phaseIndicator.querySelector('.day-number');
const playersList = document.getElementById('players-list');
const timeline = document.getElementById('timeline');
const panelTitle = document.getElementById('panel-title');
const thoughtsContainer = document.getElementById('thoughts-container');

// Escape HTML
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Update phase indicator
function updatePhaseIndicator(phase, day) {
    phaseIndicator.className = `phase-badge phase-${phase.toLowerCase()}`;
    phaseName.textContent = phase;
    if (day) {
        dayNumberEl.textContent = `Day ${day}`;
    }
}

// Update players list
function updatePlayers(players) {
    playersList.innerHTML = players.map(p => {
        const isViewing = p.name === playerName;
        return `
            <li class="player-item ${p.is_alive ? 'alive' : 'dead'} ${isViewing ? 'viewing' : ''}">
                <a href="/player/${p.name}" 
                   class="player-link ${isViewing ? 'active' : ''}" 
                   style="border-left: 4px solid ${getPlayerColor(p.name)}">
                    <span class="player-name" style="color: ${getPlayerColor(p.name)}">${p.name}</span>
                    <span class="player-role role-${p.role.toLowerCase()}">${p.role}</span>
                    <span class="player-status">${p.is_alive ? '🟢' : '💀'}</span>
                </a>
            </li>
        `;
    }).join('');
}

// Render timeline
function renderTimeline() {
    if (timelineState.phases.length === 0) {
        timeline.innerHTML = '<span class="timeline-loading">Waiting for game...</span>';
        return;
    }
    
    let html = '';
    let lastDay = 0;
    
    timelineState.phases.forEach((phase, idx) => {
        if (phase.dayNumber !== lastDay) {
            if (idx > 0) html += '<div class="timeline-connector"></div>';
            html += `<div class="timeline-day-marker">Day ${phase.dayNumber}</div>`;
            lastDay = phase.dayNumber;
        } else if (idx > 0) {
            html += '<div class="timeline-connector"></div>';
        }
        
        const isActive = idx === timelineState.currentIndex;
        
        html += `
            <div class="timeline-phase phase-${phase.phase.toLowerCase()} ${isActive ? 'active' : ''}" 
                 onclick="navigateToPhase(${idx})"
                 title="${phase.phase} - Day ${phase.dayNumber}">
                <span class="timeline-phase-icon">${PHASE_ICONS[phase.phase] || '❓'}</span>
                <span class="timeline-phase-label">${phase.phase}</span>
            </div>
        `;
    });
    
    if (timelineState.isLive && timelineState.currentIndex === timelineState.liveIndex) {
        html += '<div class="timeline-connector"></div>';
        html += `
            <div class="timeline-live-indicator">
                <span class="live-dot"></span>
                <span>LIVE</span>
            </div>
        `;
    }
    
    timeline.innerHTML = html;
}

// Navigate to phase
function navigateToPhase(index) {
    if (index < 0 || index >= timelineState.phases.length) return;
    
    timelineState.currentIndex = index;
    timelineState.isLive = (index === timelineState.liveIndex);
    
    const snapshot = timelineState.phases[index];
    
    updatePhaseIndicator(snapshot.phase, snapshot.dayNumber);
    updatePlayers(snapshot.players);
    
    // Show thoughts for this phase
    const phaseKey = `${snapshot.dayNumber}_${snapshot.phase}`;
    renderThoughtsForPhase(phaseKey, snapshot);
    
    renderTimeline();
}

// Render thoughts for a specific phase
function renderThoughtsForPhase(phaseKey, snapshot) {
    panelTitle.textContent = `${playerName}'s Thoughts - ${snapshot.phase} Day ${snapshot.dayNumber}`;
    
    const thoughts = thoughtsByPhase[phaseKey] || [];
    
    if (thoughts.length === 0) {
        thoughtsContainer.innerHTML = `
            <div class="thoughts-placeholder">
                No thoughts recorded for ${playerName} during this phase.
            </div>
        `;
        return;
    }
    
    thoughtsContainer.innerHTML = '';
    thoughts.forEach(thought => addThought(thought, false));
}

// Format tool calls
function formatToolCalls(toolCalls) {
    if (!toolCalls || toolCalls.length === 0) return '';
    
    return toolCalls.map(tc => {
        let args;
        try {
            args = JSON.parse(tc.function.arguments);
        } catch {
            args = tc.function.arguments;
        }
        return `<div class="tool-call">
            <span class="tool-name">[${tc.function.name}]</span>
            <span class="tool-args">${typeof args === 'object' ? JSON.stringify(args) : args}</span>
        </div>`;
    }).join('');
}

// Add a thought message
function addThought(thought, scroll = true) {
    const placeholder = thoughtsContainer.querySelector('.thoughts-placeholder');
    if (placeholder) placeholder.remove();
    
    const msgEl = document.createElement('div');
    msgEl.className = `thought-message thought-${thought.role}`;
    
    let content = '';
    if (thought.role === 'system') {
        content = `
            <div class="thought-label">System Prompt</div>
            <div class="thought-content">${escapeHtml(thought.content)}</div>
        `;
    } else if (thought.role === 'user') {
        content = `
            <div class="thought-label">Game Update</div>
            <div class="thought-content">${escapeHtml(thought.content)}</div>
        `;
    } else if (thought.role === 'assistant') {
        content = `
            <div class="thought-label">Thinking</div>
            <div class="thought-content">${thought.content ? escapeHtml(thought.content) : '<em>No verbal response</em>'}</div>
            ${formatToolCalls(thought.tool_calls)}
        `;
    } else if (thought.role === 'tool') {
        content = `
            <div class="thought-label">Tool Result</div>
            <div class="thought-content tool-result">${escapeHtml(thought.content)}</div>
        `;
    }
    
    msgEl.innerHTML = content;
    thoughtsContainer.appendChild(msgEl);
    
    if (scroll) {
        thoughtsContainer.scrollTop = thoughtsContainer.scrollHeight;
    }
}

// Back to town square
function backToTownSquare() {
    window.location.href = '/';
}

// Handle SSE events
function handleEvent(event) {
    const data = JSON.parse(event.data);
    console.log('Event:', data);
    
    switch (data.event_type) {
        case 'INITIAL_STATE':
            gameState.players = data.data.players;
            gameState.phase = data.data.phase;
            gameState.dayNumber = data.data.day_number || 1;
            
            // Initialize current phase key
            currentPhaseKey = `${gameState.dayNumber}_${gameState.phase}`;
            
            // Load player thoughts if available
            if (data.data.player_thoughts && data.data.player_thoughts[playerName]) {
                thoughtsByPhase = data.data.player_thoughts[playerName];
                console.log('Loaded thoughts for', playerName, ':', Object.keys(thoughtsByPhase));
            }
            
            if (data.data.phase_history && data.data.phase_history.length > 0) {
                timelineState.phases = data.data.phase_history;
                timelineState.liveIndex = timelineState.phases.length - 1;
                timelineState.currentIndex = timelineState.liveIndex;
                timelineState.isLive = !data.data.winner; // Live if no winner yet
                
                renderTimeline();
                navigateToPhase(timelineState.currentIndex);
            } else {
                // No phase history yet - create initial phase
                const initialPhase = {
                    phase: gameState.phase,
                    dayNumber: gameState.dayNumber,
                    players: data.data.players || [],
                    events: []
                };
                timelineState.phases.push(initialPhase);
                timelineState.liveIndex = 0;
                timelineState.currentIndex = 0;
                timelineState.isLive = true;
                renderTimeline();
                navigateToPhase(0);
            }
            
            // Also render current thoughts right away
            const currentKey = `${gameState.dayNumber}_${gameState.phase}`;
            if (thoughtsByPhase[currentKey] && thoughtsByPhase[currentKey].length > 0) {
                thoughtsContainer.innerHTML = '';
                thoughtsByPhase[currentKey].forEach(t => addThought(t, false));
            }
            break;
            
        case 'PHASE_CHANGE':
            gameState.phase = data.data.phase;
            gameState.dayNumber = data.data.day_number;
            currentPhaseKey = `${data.data.day_number}_${data.data.phase}`;
            
            if (!thoughtsByPhase[currentPhaseKey]) {
                thoughtsByPhase[currentPhaseKey] = [];
            }
            
            const newPhase = {
                phase: data.data.phase,
                dayNumber: data.data.day_number,
                players: JSON.parse(JSON.stringify(gameState.players)),
                events: []
            };
            
            timelineState.phases.push(newPhase);
            timelineState.liveIndex = timelineState.phases.length - 1;
            
            if (timelineState.isLive) {
                timelineState.currentIndex = timelineState.liveIndex;
                navigateToPhase(timelineState.currentIndex);
            }
            
            renderTimeline();
            break;
            
        case 'PLAYER_THOUGHT':
            if (data.data.player_name === playerName) {
                // Use phase info from the event itself
                const thoughtPhase = data.data.phase || gameState.phase;
                const thoughtDay = data.data.day_number || gameState.dayNumber;
                const phaseKey = `${thoughtDay}_${thoughtPhase}`;
                
                if (!thoughtsByPhase[phaseKey]) {
                    thoughtsByPhase[phaseKey] = [];
                }
                
                const userThought = {role: 'user', content: data.data.prompt};
                const assistantThought = {
                    role: 'assistant',
                    content: data.data.response,
                    tool_calls: data.data.tool_calls
                };
                
                // Add to storage
                thoughtsByPhase[phaseKey].push(userThought);
                thoughtsByPhase[phaseKey].push(assistantThought);
                
                // Determine if we should display - viewing current phase or live
                const viewingPhaseKey = timelineState.currentIndex >= 0 
                    ? `${timelineState.phases[timelineState.currentIndex]?.dayNumber}_${timelineState.phases[timelineState.currentIndex]?.phase}`
                    : null;
                
                if (timelineState.isLive || phaseKey === viewingPhaseKey) {
                    // Remove placeholder if present
                    const placeholder = thoughtsContainer.querySelector('.thoughts-placeholder');
                    if (placeholder) placeholder.remove();
                    
                    addThought(userThought);
                    addThought(assistantThought);
                }
            }
            break;
            
        case 'PLAYER_DEATH':
            const deadPlayer = gameState.players.find(p => p.name === data.data.player);
            if (deadPlayer) deadPlayer.is_alive = false;
            updatePlayers(gameState.players);
            break;
            
        case 'GAME_END':
            gameState.players = data.data.players;
            
            const gameOverPhase = {
                phase: 'GAME_OVER',
                dayNumber: gameState.dayNumber,
                players: data.data.players,
                events: []
            };
            
            timelineState.phases.push(gameOverPhase);
            timelineState.liveIndex = timelineState.phases.length - 1;
            
            if (timelineState.isLive) {
                timelineState.currentIndex = timelineState.liveIndex;
                navigateToPhase(timelineState.currentIndex);
            }
            
            renderTimeline();
            break;
    }
}

// Connect to SSE
const evtSource = new EventSource(`/player/${playerName}/events`);
evtSource.onmessage = handleEvent;
evtSource.onerror = function(e) {
    console.error('SSE error:', e);
};

// Initial load
fetch(`/api/player/${playerName}/thoughts`)
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            thoughtsContainer.innerHTML = '<div class="error">Player not found</div>';
        } else {
            // Store thoughts
            const phaseKey = `${gameState.dayNumber}_${gameState.phase}`;
            thoughtsByPhase[phaseKey] = data.thoughts || [];
            
            thoughtsContainer.innerHTML = '';
            (data.thoughts || []).forEach(t => addThought(t, false));
        }
    })
    .catch(e => {
        console.error('Initial load error:', e);
        thoughtsContainer.innerHTML = '<div class="thoughts-placeholder">Waiting for game...</div>';
    });

// Also fetch initial state for timeline
fetch('/api/state')
    .then(r => r.json())
    .then(data => {
        if (!data.error) {
            gameState.players = data.players;
            gameState.phase = data.phase;
            gameState.dayNumber = data.day_number;
            currentPhaseKey = `${data.day_number}_${data.phase}`;
            
            updatePlayers(data.players);
            updatePhaseIndicator(data.phase, data.day_number);
            
            if (data.phase_history && data.phase_history.length > 0) {
                timelineState.phases = data.phase_history;
                timelineState.liveIndex = timelineState.phases.length - 1;
                timelineState.currentIndex = timelineState.liveIndex;
                timelineState.isLive = !data.winner;
                renderTimeline();
            }
        }
    });
</script>
{% endblock %}

[project]
name = "llm-mafia"
version = "0.1.0"
description = "LLM-powered Mafia game with web viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.4.2",
    "matplotlib>=3.10.8",
    "scipy>=1.17.0",
    "docent-python",
    "tqdm>=4.66.0",
]

[project.scripts]
llm-mafia = "experiments.01_run_game:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra", "web", "experiments"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
